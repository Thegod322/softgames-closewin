<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Softgames — Operation Close Win (Tripeaks & Difficulty Tuner)</title>
    <link rel="stylesheet" href="./src/ui/Layout.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="logo-area">
          <span class="badge">SOFTGAMES</span>
          <h1>Operation Close Win</h1>
        </div>
        <nav class="module-tabs">
          <button id="tab-game" class="tab-btn active">🎮 Playable Prototype</button>
          <button id="tab-tuner" class="tab-btn">📊 Difficulty Tuner & Monte Carlo</button>
        </nav>
      </header>

      <main class="app-main">
        <!-- Module 1: Game Prototype View -->
        <section id="game-view" class="module-view active">
          <div class="game-toolbar">
            <div class="level-select-group">
              <label for="level-select">Select Level:</label>
              <select id="level-select">
                <option value="level_25">Level 25 (Baseline / Hard)</option>
                <option value="level_31">Level 31 (Zap + Locks + Keys)</option>
                <option value="level_43">Level 43 (Complex Multi-Layer)</option>
                <option value="level_54">Level 54 (Bomb Modifiers)</option>
              </select>
              <input type="file" id="input-game-upload-level" accept=".json" multiple style="display: none;" />
              <button id="btn-game-upload-level" class="btn btn-upload-level btn-sm" title="Upload level JSON file(s)">📂 Upload JSON</button>
              <label for="game-deck-size" style="margin-left: 8px; font-size: 12px; color: var(--text-muted);">Hand Size:</label>
              <input type="number" id="game-deck-size" min="5" max="45" value="14" style="width: 54px; padding: 4px 6px; font-size: 12px; background: var(--bg-primary); border: 1px solid var(--border-subtle); color: var(--text-main); border-radius: var(--radius-sm); text-align: center;" />
              <span id="active-seed-badge" class="badge-pill" style="font-family: monospace; font-size: 11px;">Seed: #42</span>
            </div>
            <div class="game-actions">
              <div class="restart-group">
                <button id="btn-restart" class="btn btn-secondary">↺ Restart</button>
                <label class="checkbox-label" title="Keep the same seed/deal on restart">
                  <input type="checkbox" id="chk-keep-seed" />
                  <span>Keep seed</span>
                </label>
                <label class="checkbox-label" title="Play curated winnable Close-Win seeds">
                  <input type="checkbox" id="chk-golden-seed" />
                  <span style="color: #fbbf24; font-weight: 700;">🌟 Golden Seed</span>
                </label>
              </div>
              <button id="btn-undo" class="btn btn-secondary">↶ Undo</button>
            </div>
          </div>
          <div id="canvas-container"></div>
        </section>

        <!-- Module 2: Tuner & Simulation View -->
        <section id="tuner-view" class="module-view">
          <div id="tuner-dashboard"></div>
        </section>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
